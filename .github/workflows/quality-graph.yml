# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: 'false'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make build
      name: Run Build
      id: quality-command
      continue-on-error: true
    - name: Collect Build result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@a4a65abfc9364da6801be56b992358d302c7ad77
      with:
        operation: collect
        node-id: build
        title: Build
        adapter: exit-code
        report-path: ''
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 837c4fdac3c390975bcb24b8648637375754fd81c9f5b17e0e801955b0f083cb
    - name: Upload Build result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-build-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/build.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Build result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
