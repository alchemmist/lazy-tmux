name: tmux version support

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  tmux-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Test PR branch
        run: |
          chmod +x scripts/test-tmux-versions.sh
          ./scripts/test-tmux-versions.sh > pr_results.txt 2>&1 || true
          cat pr_results.txt

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Test main branch
        run: |
          chmod +x scripts/test-tmux-versions.sh
          ./scripts/test-tmux-versions.sh > main_results.txt 2>&1 || true
          cat main_results.txt

      - name: Compare and format results
        id: compare
        run: |
          # Извлекаем списки поддерживаемых версий
          PR_SUPPORTED=$(grep '✓' pr_results.txt | awk '{print $2}' | sort || true)
          MAIN_SUPPORTED=$(grep '✓' main_results.txt | awk '{print $2}' | sort || true)

          HAS_DIFF=""
          MSG=""

          # Версии, которые появились в PR
          NEW_IN_PR=$(comm -23 <(echo "$PR_SUPPORTED") <(echo "$MAIN_SUPPORTED") || true)
          # Версии, которые пропали в PR
          MISSING_IN_PR=$(comm -13 <(echo "$PR_SUPPORTED") <(echo "$MAIN_SUPPORTED") || true)

          if [ -n "$NEW_IN_PR" ] || [ -n "$MISSING_IN_PR" ]; then
            HAS_DIFF="yes"
            if [ -n "$NEW_IN_PR" ]; then
              MSG="${MSG}**⚠️ New versions supported in this PR:**\n"
              while IFS= read -r v; do
                [ -n "$v" ] && MSG="${MSG}- \`$v\`\n"
              done <<< "$NEW_IN_PR"
              MSG="${MSG}\n"
            fi
            if [ -n "$MISSING_IN_PR" ]; then
              MSG="${MSG}**⚠️ Versions no longer supported:**\n"
              while IFS= read -r v; do
                [ -n "$v" ] && MSG="${MSG}- \`$v\`\n"
              done <<< "$MISSING_IN_PR"
              MSG="${MSG}\n"
            fi
          fi

          echo "has_diff=${HAS_DIFF}" >> $GITHUB_OUTPUT
          echo "MSG<<ENDOFMSG" >> $GITHUB_ENV
          printf "%b" "$MSG" >> $GITHUB_ENV
          echo "ENDOFMSG" >> $GITHUB_ENV

          # Сохраним полный вывод PR для блока кода
          echo "PR_RESULTS<<ENDOFRESULTS" >> $GITHUB_ENV
          cat pr_results.txt >> $GITHUB_ENV
          echo "ENDOFRESULTS" >> $GITHUB_ENV

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: tmux-versions
          body: |
            ### tmux version support test
            ${{ env.MSG }}
            <details>
            <summary>Full test output</summary>

            ```
            ${{ env.PR_RESULTS }}
            ```
            </details>
