name: tmux version test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  test-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run tests & parse results
        run: |
          # The inner test prints the clean version table to stdout and failure
          # diagnostics to stderr (see docker/test-versions-inner.sh). Keep stderr
          # OUT of pr_raw.txt — which is embedded verbatim into the PR comment —
          # so the table renders neatly; diagnostics are kept in pr_err.txt for
          # debugging.
          set -o pipefail
          make test-sup-versions 2>pr_err.txt | tee pr_raw.txt | ./scripts/parse-output.sh > pr.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-results
          path: |
            pr.json
            pr_raw.txt
            pr_err.txt

  test-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Run tests & parse results
        run: |
          # Keep stderr out of main_raw.txt (see the PR job for why).
          set -o pipefail
          make test-sup-versions 2>main_err.txt | tee main_raw.txt | ./scripts/parse-output.sh > main.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: main-results
          path: |
            main.json
            main_raw.txt
            main_err.txt

  comment:
    needs: [test-pr, test-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pr-results
      - uses: actions/download-artifact@v8
        with:
          name: main-results

      - name: Generate Markdown body
        run: |
          chmod +x ./scripts/format-comment.sh
          ./scripts/format-comment.sh pr.json main.json pr_raw.txt > body.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: <!-- tmux-versions-marker -->

      - uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: body.md
          edit-mode: replace
