name: actionlint-shellcheck

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run pinned actionlint and shellcheck
        run: make test-lint-actions-shell
