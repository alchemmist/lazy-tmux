name: tmux version comment

on:
  workflow_run:
    workflows: ["tmux version test"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.pull_requests[0] != null }}
    timeout-minutes: 5

    steps:
      - name: Download comment body
        uses: actions/download-artifact@v4
        with:
          name: tmux-comment-body
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post or update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          # Декодируем base64 — безопасно, нет shell injection
          BODY=$(base64 -d comment_body.txt.b64)
          MARKER="<!-- tmux-versions-marker -->"
          FULL_BODY=$(printf '%s\n\n%s' "$MARKER" "$BODY")

          # Кодируем тело в JSON через jq — безопасно, нет injection
          PAYLOAD=$(jq -n --arg body "$FULL_BODY" '{body: $body}')
          TMPFILE=$(mktemp)
          printf '%s' "$PAYLOAD" > "$TMPFILE"

          # Ищем существующий комментарий по маркеру
          EXISTING_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | jq -r '.[] | select(.body | contains("'"$MARKER"'")) | .id' \
            | head -1)

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" \
              --input "$TMPFILE"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --input "$TMPFILE"
          fi

          rm -f "$TMPFILE"
