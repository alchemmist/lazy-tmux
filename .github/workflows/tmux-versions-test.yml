name: tmux version test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  tmux-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Test versions
        run: |
          chmod +x scripts/test-tmux-versions.sh
          ./scripts/test-tmux-versions.sh > results.txt 2>&1 || true
          cat results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tmux-version-results
          path: results.txt
