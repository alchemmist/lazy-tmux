name: Deploy docs to GitHub Pages

# The site lives in docs/ as a Vite + React (Gravity UI) project, statically
# pre-rendered with vite-react-ssg. Pages is configured to deploy from GitHub
# Actions (Settings → Pages → Source: GitHub Actions). This workflow builds
# docs/ and publishes the generated docs/dist as the site root. install.sh,
# CNAME and assets/ live in docs/public and are copied verbatim into dist.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Grant the deployment read access to the repo and permission to publish to
# Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: docs
      - name: Build the static site
        run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
