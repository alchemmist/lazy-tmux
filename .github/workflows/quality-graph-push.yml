    name: Packaging change verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: 'base=$(git merge-base "$BASE" HEAD) || exit 1

          changes=$(git diff --name-only "$base" HEAD -- .goreleaser.yaml .github/workflows/release.yml scripts/verify-snapshot-packages.sh) || exit 1

          if [ -n "$changes" ]; then ./scripts/verify-snapshot-packages.sh; else echo ''Packaging unchanged''; fi

          '
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        name: Run Packaging change verification
        id: quality-command
        continue-on-error: true
      - name: Collect Packaging change verification result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
