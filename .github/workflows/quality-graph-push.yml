    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --no-project --with PyYAML==6.0.3 python scripts/quality_diff.py suppressions --base "$BASE"
