        with:
          operation: collect
          node-id: test
          title: Test
          adapter: junit
          report-path: .cache/quality-graph/test.xml
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 3290886a82023d91aa250d02a10b448d4df52615c02b7c30e1336ac3b31ccb3f
          approval-findings: 'true'
          approval-files: 'false'
