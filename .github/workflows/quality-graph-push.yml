# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph (push)
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-graph:
    name: Workflow graph validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx --from quality-graph-cli==0.1.8 --with quality-graph-github==0.1.8 qg validate
        name: Run Workflow graph validation
        id: quality-command
        continue-on-error: true
      - name: Collect Workflow graph validation result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: workflow-graph
          title: Workflow graph validation
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 3290886a82023d91aa250d02a10b448d4df52615c02b7c30e1336ac3b31ccb3f
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Workflow graph validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-workflow-graph-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/workflow-graph.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Workflow graph validation result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-all
        name: Run Build
        id: quality-command
        continue-on-error: true
      - name: Collect Build result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: build
          title: Build
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 3290886a82023d91aa250d02a10b448d4df52615c02b7c30e1336ac3b31ccb3f
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Build result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - workflow-graph
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup tools
        run: make setup-env
      - run: make test-cov && python3 scripts/quality_diff.py coverage --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        name: Run Coverage
        id: quality-command
        continue-on-error: true
      - name: Collect Coverage result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: coverage
          title: Coverage
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 3290886a82023d91aa250d02a10b448d4df52615c02b7c30e1336ac3b31ccb3f
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Coverage result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-coverage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Coverage result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - workflow-graph
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
