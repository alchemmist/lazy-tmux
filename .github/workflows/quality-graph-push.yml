---
name: Quality Graph (push)
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
        name: Run Build
        id: quality-command
        continue-on-error: true
      - name: Collect Build result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: build
          title: Build
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 85b47b6858cc29a283f6d23b4c8ac09d43d684773614693d2caf5788b16704f3
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Build result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
