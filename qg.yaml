---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
      publisher-action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69

profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
          fetch-depth: "0"

  go:
    extends: default
    setup:
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

  go-tools:
    extends: go
    setup:
      - name: Setup tools
        run: make setup-env

  docs:
    extends: default
    setup:
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/package-lock.json

  tmux:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
          fetch-depth: "0"

  quality-graph:
    extends: default
    setup:
      - uses: astral-sh/setup-uv@v10.3.3

nodes:
  workflow-graph:
    title: Workflow graph validation
    profile: quality-graph
    run: uvx --from quality-graph-cli==0.1.8 --with quality-graph-github==0.1.8 qg validate

  build:
    title: Build
    profile: go
    needs: [workflow-graph]
    run: make build-all

  coverage:
    needs: [test, integration]
    title: Coverage
    profile: go-tools
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    run: make test-cov && python3 scripts/quality_diff.py coverage --base "$BASE"

  golangci-lint:
    needs: [nolint-exclusions]
    title: GolangCI-Lint
    profile: go-tools
    run: make golangci-lint

  test:
    needs: [build, fast-tests]
    title: Test
    profile: go-tools
    run: make test
    results:
      junit: .cache/quality-graph/test.xml

  test-fzf:
    needs: [build]
    title: Test (fzf)
    profile: go-tools
    run: make test-fzf
    results:
      junit: .cache/quality-graph/test-fzf.xml

  docs-build:
    needs: [npm-audit]
    title: Docs build
    profile: docs
    run: make docs-install && make docs-build

  integration:
    needs: [workflow-shell-lint, build, fast-tests]
    title: Integration tests
    profile: default
    run: make integration-test

  tmux-versions:
    needs: [integration]
    title: Tmux version test
    profile: tmux
    timeout-minutes: 180
    run: ./scripts/quality-graph-tmux-versions.sh
    results:
      native: .cache/quality-graph/tmux-versions.json

  workflow-shell-lint:
    title: Workflow and shell lint
    needs: [workflow-graph]
    run: make test-lint-actions-shell && python3 -m unittest discover -s scripts -p 'test_quality*.py'

  nolint-exclusions:
    title: New Go lint exceptions
    profile: quality-graph
    needs: [workflow-graph]
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    run: uv run --no-project --with PyYAML==6.0.3 python scripts/quality_diff.py suppressions --base "$BASE"

  packaging:
    needs: [test, test-fzf, golangci-lint, go-audit, secrets]
    title: Packaging change verification
    profile: go
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    run: |
      base=$(git merge-base "$BASE" HEAD) || exit 1
      changes=$(git diff --name-only "$base" HEAD -- .goreleaser.yaml .github/workflows/release.yml scripts/verify-snapshot-packages.sh) || exit 1
      if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -n "$changes" ]; then ./scripts/verify-snapshot-packages.sh; else echo 'Packaging unchanged'; fi

  fast-tests:
    title: Fast Go tests and picker screens
    needs: [workflow-graph]
    profile: go
    run: go test -short ./internal/picker ./internal/config ./internal/snapshot ./internal/store

  performance:
    needs: [test, workflow-shell-lint]
    title: Go workload regression
    profile: go
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    run: python3 scripts/performance_diff.py "$BASE"

  go-audit:
    needs: [workflow-shell-lint]
    title: Go dependency integrity and reachable vulnerabilities
    profile: go
    run: scripts/audit-quality.sh go

  npm-audit:
    needs: [workflow-shell-lint]
    title: Docs dependency audit
    profile: docs
    run: scripts/audit-quality.sh npm

  secrets:
    title: Tracked tree secret scan
    needs: [workflow-graph]
    run: scripts/audit-quality.sh secrets
