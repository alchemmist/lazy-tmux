---
version: 0
provider:
  name: github
  configuration:
    runtime:
      action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
      publisher-action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69

profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"

  go:
    extends: default
    setup:
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

  go-tools:
    extends: go
    setup:
      - name: Setup tools
        run: make setup-env

nodes:
  build:
    title: Build
    profile: go
    run: make build

  coverage:
    title: Coverage
    profile: go-tools
    run: make test-cov

  golangci-lint:
    title: GolangCI-Lint
    profile: go-tools
    run: make golangci-lint

  test:
    title: Test
    profile: go-tools
    run: make test

  integration:
    title: Integration tests
    profile: go-tools
    run: make integration-test

  tmux-versions:
    title: Tmux version test
    timeout-minutes: 60
    run: ./scripts/quality-graph-tmux-versions.sh
    results:
      native: .cache/quality-graph/tmux-versions.json
