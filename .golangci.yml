version: "2"

run:
  timeout: 5m

linters:
  default: all

  disable:
    - testpackage
    - paralleltest
    - mnd
    - goconst
    - ireturn
    - gochecknoglobals
    - funlen
    - exhaustruct
    - err113
    - exhaustive
    - cyclop
    - revive
    - gosec

    - wsl
    - wsl_v5

  exclusions:
    rules:
      # Test files idiomatically use short receiver-style names (t, m, a, s)
      # and inline error checks; keep these style linters for production code
      # only.
      - path: _test\.go
        linters:
          - varnamelen
          - noinlineerr

  settings:
    # Allow all imports unless explicitly denied: the linter is enabled so real
    # deny rules can be added later without ceremony.
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $all
    exhaustruct:
      allow-empty: true
    # Timestamps are deliberately rendered in the user's local timezone (list
    # output, picker rows); this is a local CLI tool, not an i18n concern.
    gosmopolitan:
      allow-time-local: true
    # Snapshot and config files use snake_case keys by design; renaming struct
    # tags would break every snapshot already on disk.
    tagliatelle:
      case:
        rules:
          json: snake
          toml: snake
    varnamelen:
      ignore-names:
        - ok

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
    - golines

  settings:
    gofumpt:
      module-path: github.com/alchemmist/lazy-tmux
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/alchemmist/lazy-tmux
